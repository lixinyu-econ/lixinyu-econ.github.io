# ---------- Home page ----------

bio: >
  I am an Assistant Professor of History at Example University. My research
  examines how scientific knowledge was produced, circulated, and contested
  across colonial networks in the nineteenth and twentieth centuries.
  My first book, *Title of Your Book*, is forthcoming with Example University Press.

  I received my PhD from Example Graduate University in 2021 and was a
  postdoctoral fellow at Another Institute before joining Example University.

research_interests:
  - History of science and technology
  - Empire and colonialism
  - Global and transnational history
  - Knowledge, archives, and translation

